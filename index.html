<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Fer Walk v1.2</title>

<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"
    onerror="this.onerror=null;this.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';"
/>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#10131a;
    color:white;
    overflow:hidden;
}

header{
    height:70px;
    background:linear-gradient(135deg,#10131a,#1b222d);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 18px;
    position:relative;
    z-index:1000;
    box-shadow:0 3px 15px rgba(0,0,0,.35);
}

.logo{
    font-size:23px;
    font-weight:900;
    letter-spacing:.5px;
}

.logo span{
    color:#35e58b;
}

.status{
    display:flex;
    align-items:center;
    gap:7px;
    font-size:13px;
    color:#aaa;
}

.dot{
    width:9px;
    height:9px;
    border-radius:50%;
    background:#777;
}

.dot.active{
    background:#35e58b;
    box-shadow:0 0 10px #35e58b;
}

.dot.warn{
    background:#f0b429;
    box-shadow:0 0 10px #f0b429;
}

.dot.error{
    background:#e74c3c;
    box-shadow:0 0 10px #e74c3c;
}

#map{
    position:absolute;
    top:70px;
    bottom:265px;
    left:0;
    right:0;
    z-index:1;
}

.map-error{
    display:flex;
    align-items:center;
    justify-content:center;
    height:100%;
    padding:30px;
    text-align:center;
    color:#aaa;
    font-size:14px;
    background:#181d25;
}

.panel{
    position:absolute;
    bottom:0;
    left:0;
    right:0;
    height:265px;
    background:rgba(16,19,26,.97);
    border-radius:25px 25px 0 0;
    padding:18px;
    z-index:1000;
    box-shadow:0 -8px 30px rgba(0,0,0,.35);
}

.handle{
    width:45px;
    height:5px;
    border-radius:10px;
    background:#444;
    margin:-5px auto 15px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
}

.stat{
    background:#1c232d;
    border-radius:15px;
    padding:12px 5px;
    text-align:center;
}

.stat small{
    display:block;
    color:#888;
    font-size:10px;
    margin-bottom:5px;
}

.stat strong{
    font-size:17px;
}

.unit{
    font-size:10px;
    color:#777;
}

.controls{
    display:flex;
    gap:10px;
    margin-top:15px;
}

button{
    border:0;
    border-radius:15px;
    padding:15px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
    font-family:inherit;
}

#startBtn{
    flex:1;
    background:#35e58b;
    color:#07150e;
}

#pauseBtn{
    width:80px;
    background:#f0b429;
    color:#17120a;
    display:none;
}

#stopBtn{
    width:80px;
    background:#e74c3c;
    color:white;
    display:none;
}

button:disabled{
    opacity:.45;
    cursor:not-allowed;
}

.message{
    text-align:center;
    margin-top:10px;
    color:#777;
    font-size:12px;
    min-height:16px;
}

.leaflet-control-attribution{
    font-size:9px;
}

.fab{
    position:absolute;
    right:15px;
    z-index:1000;
    width:48px;
    height:48px;
    border-radius:50%;
    background:#1c232d;
    color:white;
    box-shadow:0 4px 15px rgba(0,0,0,.35);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
    border:0;
    padding:0;
}

.locate{
    bottom:285px;
    font-size:22px;
}

.follow{
    bottom:345px;
    color:#666;
}

.follow.on{
    color:#35e58b;
}

.planToggle{
    bottom:405px;
    color:#666;
}

.planToggle.on{
    color:#5b8cff;
    background:#1c2536;
}

.plan-panel{
    position:absolute;
    top:82px;
    left:15px;
    right:15px;
    z-index:1000;
    background:rgba(23,28,36,.96);
    border-radius:18px;
    padding:10px 14px;
    display:none;
    align-items:center;
    justify-content:space-between;
    box-shadow:0 6px 20px rgba(0,0,0,.35);
}

.plan-info small{
    display:block;
    color:#888;
    font-size:10px;
    letter-spacing:.5px;
}

.plan-info strong{
    font-size:17px;
    color:#5b8cff;
}

.plan-actions{
    display:flex;
    gap:8px;
}

.plan-actions button{
    width:38px;
    height:38px;
    padding:0;
    border-radius:12px;
    background:#2a323e;
    color:white;
    font-size:15px;
    border:0;
}

#clearPlanBtn{
    background:#4a2a2a;
}

#donePlanBtn{
    background:#35e58b;
    color:#07150e;
}

.plan-hint{
    position:absolute;
    top:82px;
    left:15px;
    right:15px;
    z-index:999;
    text-align:center;
    color:#9db3ff;
    font-size:12px;
    background:rgba(23,28,36,.9);
    border-radius:12px;
    padding:6px 10px;
    display:none;
}

.summary{
    position:absolute;
    inset:0;
    background:rgba(0,0,0,.78);
    backdrop-filter:blur(8px);
    z-index:3000;
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.summary-card{
    width:100%;
    max-width:430px;
    background:#171c24;
    border-radius:25px;
    padding:25px;
    text-align:center;
    box-shadow:0 15px 50px rgba(0,0,0,.5);
}

.summary-card h2{
    margin-top:0;
    color:#35e58b;
}

.summary-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin:20px 0;
}

.summary-item{
    background:#222934;
    padding:15px;
    border-radius:15px;
}

.summary-item small{
    display:block;
    color:#888;
    margin-bottom:5px;
}

#closeSummary{
    width:100%;
    background:#35e58b;
}

@media(max-height:650px){
    #map{
        bottom:240px;
    }

    .panel{
        height:240px;
    }

    .locate{
        bottom:260px;
    }

    .follow{
        bottom:320px;
    }

    .planToggle{
        bottom:380px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">🚶 <span>Fer</span> Walk</div>

    <div class="status">
        <div id="statusDot" class="dot"></div>
        <span id="statusText">Cargando mapa...</span>
    </div>
</header>

<div id="map"></div>

<div class="plan-panel" id="planPanel">
    <div class="plan-info">
        <small>RUTA PERSONALIZADA</small>
        <strong><span id="planDistance">0.00</span> km</strong>
    </div>
    <div class="plan-actions">
        <button id="undoPlanBtn" title="Deshacer último punto" aria-label="Deshacer último punto">↩</button>
        <button id="clearPlanBtn" title="Borrar ruta" aria-label="Borrar ruta">🗑</button>
        <button id="donePlanBtn" title="Guardar y salir" aria-label="Guardar ruta y salir">✓</button>
    </div>
</div>

<div class="plan-hint" id="planHint">Toca el mapa para añadir puntos de tu ruta</div>

<button class="fab planToggle" id="planBtn" aria-label="Personalizar ruta" title="Personalizar ruta" disabled>✎</button>
<button class="fab follow on" id="followBtn" aria-label="Activar/desactivar seguimiento del mapa" title="Seguir mi ubicación" disabled>⦿</button>
<button class="fab locate" id="locateBtn" aria-label="Centrar mapa en mi ubicación" title="Ir a mi ubicación" disabled>⌖</button>

<section class="panel">

    <div class="handle"></div>

    <div class="stats">

        <div class="stat">
            <small>DISTANCIA</small>
            <strong id="distance">0.00</strong>
            <span class="unit">km</span>
        </div>

        <div class="stat">
            <small>TIEMPO</small>
            <strong id="time">00:00</strong>
        </div>

        <div class="stat">
            <small>VELOCIDAD</small>
            <strong id="speed">0.0</strong>
            <span class="unit">km/h</span>
        </div>

        <div class="stat">
            <small>RITMO</small>
            <strong id="pace">--:--</strong>
            <span class="unit">min/km</span>
        </div>

    </div>

    <div class="controls">

        <button id="startBtn" aria-label="Iniciar caminata" disabled>
            ▶ Iniciar caminata
        </button>

        <button id="pauseBtn" aria-label="Pausar caminata">
            ⏸
        </button>

        <button id="stopBtn" aria-label="Terminar caminata">
            ■
        </button>

    </div>

    <div class="message" id="message">
        Cargando mapa...
    </div>

</section>

<div class="summary" id="summary">

    <div class="summary-card">

        <h2>🎉 Caminata terminada</h2>

        <div class="summary-grid">

            <div class="summary-item">
                <small>Distancia</small>
                <strong id="finalDistance">0.00 km</strong>
            </div>

            <div class="summary-item">
                <small>Tiempo</small>
                <strong id="finalTime">00:00</strong>
            </div>

            <div class="summary-item">
                <small>Velocidad media</small>
                <strong id="finalSpeed">0.0 km/h</strong>
            </div>

            <div class="summary-item">
                <small>Puntos GPS</small>
                <strong id="finalPoints">0</strong>
            </div>

        </div>

        <button id="closeSummary">
            Cerrar
        </button>

    </div>

</div>

<script>

/* =========================================
   FER WALK v1.2
   Cambios sobre v1.1:

   BUG CRÍTICO CORREGIDO:
   - "Uncaught ReferenceError: L is not defined": Leaflet se
     cargaba solo desde unpkg.com, que en algunos entornos
     (por ejemplo, la vista previa sandboxed de Claude) queda
     bloqueado por política de seguridad del navegador. Como
     el script no tenía manejo de error, un solo fallo de red
     tiraba abajo TODA la app (ninguna función volvía a
     ejecutarse, ni siquiera las que no usan mapas).
     Ahora:
       1. Se intenta cargar Leaflet desde cdnjs.cloudflare.com.
       2. Si falla, se reintenta desde unpkg.com como respaldo.
       3. Si ambos fallan, se muestra un mensaje claro en vez
          de romper la app, y los botones quedan deshabilitados
          en vez de lanzar errores al pulsarlos.
     Los botones empiezan deshabilitados y solo se activan
     cuando el mapa termina de inicializarse correctamente.

   NUEVO: Modo "Personalizar ruta"
   - Botón nuevo (✎) para activar el modo de planificación.
   - Al activarlo, cada toque en el mapa añade un punto; se
     dibuja una línea azul discontinua uniendo los puntos y un
     panel muestra la distancia total planeada.
   - Deshacer último punto, borrar toda la ruta, o guardar y
     salir del modo edición.
   - La ruta personalizada queda visible como referencia (línea
     azul discontinua) mientras caminas, junto a tu recorrido
     real en GPS (línea verde sólida), para poder comparar.
   - No se puede editar la ruta mientras hay una caminata en
     curso (hay que pausar/terminar primero).
   ========================================= */

let map;
let routeLine;
let userMarker;
let accuracyCircle;

let watchId = null;

let tracking = false;
let paused = false;
let followMode = true;
let mapReady = false;

let route = [];

let totalDistance = 0;

let startTime = 0;
let pausedTime = 0;
let pauseStarted = 0;

let lastPosition = null;
let timerInterval = null;

let wakeLock = null;

/* Ruta personalizada */
let planningMode = false;
let planPoints = [];
let planMarkers = [];
let planLine = null;
let hasPlan = false;

/* Precisión mínima aceptable (metros). Lecturas peores se ignoran
   para el cálculo de distancia, aunque el marcador sí se actualiza. */
const MAX_ACCEPTABLE_ACCURACY = 30;


/* =========================================
   ELEMENTOS
   ========================================= */

const startBtn = document.getElementById("startBtn");
const pauseBtn = document.getElementById("pauseBtn");
const stopBtn = document.getElementById("stopBtn");

const distanceEl = document.getElementById("distance");
const timeEl = document.getElementById("time");
const speedEl = document.getElementById("speed");
const paceEl = document.getElementById("pace");

const statusDot = document.getElementById("statusDot");
const statusText = document.getElementById("statusText");

const message = document.getElementById("message");

const locateBtn = document.getElementById("locateBtn");
const followBtn = document.getElementById("followBtn");
const planBtn = document.getElementById("planBtn");

const planPanel = document.getElementById("planPanel");
const planHint = document.getElementById("planHint");
const planDistanceEl = document.getElementById("planDistance");
const undoPlanBtn = document.getElementById("undoPlanBtn");
const clearPlanBtn = document.getElementById("clearPlanBtn");
const donePlanBtn = document.getElementById("donePlanBtn");

const summary = document.getElementById("summary");
const closeSummary = document.getElementById("closeSummary");


/* =========================================
   DISTANCIA GPS
   ========================================= */

function calculateDistance(lat1, lon1, lat2, lon2){

    const R = 6371000;

    const p1 = lat1 * Math.PI / 180;
    const p2 = lat2 * Math.PI / 180;

    const dp = (lat2-lat1) * Math.PI / 180;
    const dl = (lon2-lon1) * Math.PI / 180;

    const a =
        Math.sin(dp/2) * Math.sin(dp/2) +
        Math.cos(p1) *
        Math.cos(p2) *
        Math.sin(dl/2) *
        Math.sin(dl/2);

    const c =
        2 * Math.atan2(
            Math.sqrt(a),
            Math.sqrt(1-a)
        );

    return R*c;
}


/* =========================================
   FORMATO TIEMPO
   ========================================= */

function formatTime(seconds){

    seconds = Math.max(0, Math.floor(seconds));

    const h = Math.floor(seconds / 3600);
    const m = Math.floor((seconds % 3600) / 60);
    const s = seconds % 60;

    if(h > 0){

        return String(h).padStart(2,"0") + ":" +
               String(m).padStart(2,"0") + ":" +
               String(s).padStart(2,"0");

    }

    return String(m).padStart(2,"0") + ":" +
           String(s).padStart(2,"0");
}


/* =========================================
   FORMATO RITMO (min/km)
   ========================================= */

function formatPace(distanceMeters, elapsedSeconds){

    if(distanceMeters < 20 || elapsedSeconds <= 0){

        return "--:--";

    }

    const paceSecondsPerKm =
        elapsedSeconds / (distanceMeters / 1000);

    if(!isFinite(paceSecondsPerKm) || paceSecondsPerKm > 5999){

        return "--:--";

    }

    const m = Math.floor(paceSecondsPerKm / 60);
    const s = Math.round(paceSecondsPerKm % 60);

    return String(m).padStart(2,"0") + ":" +
           String(s).padStart(2,"0");
}


/* =========================================
   ACTUALIZAR TIEMPO
   ========================================= */

function updateTimer(){

    if(!tracking || paused) return;

    const elapsed =
        (Date.now() - startTime - pausedTime) / 1000;

    timeEl.textContent = formatTime(elapsed);

    if(elapsed > 0){

        const averageSpeed =
            (totalDistance / 1000) / (elapsed / 3600);

        speedEl.textContent =
            averageSpeed.toFixed(1);

        paceEl.textContent =
            formatPace(totalDistance, elapsed);
    }
}


/* =========================================
   WAKE LOCK (mantener pantalla encendida)
   ========================================= */

async function requestWakeLock(){

    if(!("wakeLock" in navigator)) return;

    try{

        wakeLock = await navigator.wakeLock.request("screen");

    }catch(err){

        wakeLock = null;

    }

}

function releaseWakeLock(){

    if(wakeLock){

        wakeLock.release().catch(()=>{});
        wakeLock = null;

    }

}

document.addEventListener("visibilitychange", () => {

    if(
        tracking &&
        !paused &&
        document.visibilityState === "visible"
    ){

        requestWakeLock();

    }

});


/* =========================================
   RUTA PERSONALIZADA
   ========================================= */

function totalPlanDistance(){

    let d = 0;

    for(let i=1;i<planPoints.length;i++){

        d += calculateDistance(
            planPoints[i-1].lat,
            planPoints[i-1].lon,
            planPoints[i].lat,
            planPoints[i].lon
        );

    }

    return d;

}

function updatePlanPanel(){

    planDistanceEl.textContent =
        (totalPlanDistance() / 1000).toFixed(2);

}

function redrawPlanLine(){

    if(!planLine){

        planLine = L.polyline([], {
            color:"#5b8cff",
            weight:5,
            opacity:.85,
            dashArray:"10,8"
        }).addTo(map);

    }

    planLine.setLatLngs(
        planPoints.map(p => [p.lat,p.lon])
    );

}

function addPlanPoint(latlng){

    planPoints.push({ lat:latlng.lat, lon:latlng.lng });

    const marker = L.circleMarker(latlng, {
        radius:6,
        color:"#fff",
        weight:2,
        fillColor:"#5b8cff",
        fillOpacity:1
    }).addTo(map);

    planMarkers.push(marker);

    redrawPlanLine();
    updatePlanPanel();

}

function undoPlanPoint(){

    if(planPoints.length === 0) return;

    planPoints.pop();

    const m = planMarkers.pop();

    if(m) map.removeLayer(m);

    redrawPlanLine();
    updatePlanPanel();

}

function clearPlan(){

    planPoints = [];

    planMarkers.forEach(m => map.removeLayer(m));
    planMarkers = [];

    if(planLine){

        map.removeLayer(planLine);
        planLine = null;

    }

    hasPlan = false;

    updatePlanPanel();

}

function handlePlanClick(e){

    addPlanPoint(e.latlng);

}

function setPlanningMode(on){

    if(!mapReady) return;

    planningMode = on;

    planBtn.classList.toggle("on", planningMode);
    planPanel.style.display = planningMode ? "flex" : "none";
    planHint.style.display = planningMode ? "block" : "none";

    if(planningMode){

        setFollowMode(false);

        map.on("click", handlePlanClick);

    }else{

        map.off("click", handlePlanClick);

        if(planPoints.length > 1){

            hasPlan = true;

            message.textContent =
                "Ruta personalizada guardada (" +
                (totalPlanDistance()/1000).toFixed(2) +
                " km). Se muestra en azul mientras caminas.";

        }

    }

}

planBtn.addEventListener("click", () => {

    if(tracking){

        alert("Pausa o termina la caminata actual antes de personalizar una ruta.");

        return;

    }

    setPlanningMode(!planningMode);

});

undoPlanBtn.addEventListener("click", undoPlanPoint);

clearPlanBtn.addEventListener("click", () => {

    if(planPoints.length === 0) return;

    if(confirm("¿Borrar la ruta personalizada?")){

        clearPlan();

    }

});

donePlanBtn.addEventListener("click", () => {

    setPlanningMode(false);

});


/* =========================================
   GPS
   ========================================= */

function startGPS(){

    if(!navigator.geolocation){

        alert("Este dispositivo no permite utilizar GPS.");

        return;
    }

    watchId = navigator.geolocation.watchPosition(
        handlePosition,
        handleGPSError,
        {
            enableHighAccuracy:true,
            maximumAge:2000,
            timeout:15000
        }
    );

}


/* =========================================
   MODO SEGUIR
   ========================================= */

function setFollowMode(on){

    followMode = on;

    followBtn.classList.toggle("on", followMode);

}

followBtn.addEventListener("click", () => {

    setFollowMode(!followMode);

    if(followMode && userMarker){

        map.panTo(userMarker.getLatLng(), { animate:true });

    }

});


/* =========================================
   POSICIÓN
   ========================================= */

function handlePosition(position){

    const lat = position.coords.latitude;
    const lon = position.coords.longitude;

    const accuracy = position.coords.accuracy;

    statusDot.classList.remove("warn","error");
    statusDot.classList.add("active");

    statusText.textContent =
        accuracy <= MAX_ACCEPTABLE_ACCURACY
            ? "GPS conectado"
            : "GPS débil (±" + Math.round(accuracy) + " m)";

    if(accuracy > MAX_ACCEPTABLE_ACCURACY){

        statusDot.classList.remove("active");
        statusDot.classList.add("warn");

    }

    if(!userMarker){

        userMarker = L.circleMarker(
            [lat,lon],
            {
                radius:8,
                color:"#fff",
                weight:3,
                fillColor:"#35e58b",
                fillOpacity:1
            }
        ).addTo(map);

    }else{

        userMarker.setLatLng([lat,lon]);

    }

    if(!accuracyCircle){

        accuracyCircle = L.circle(
            [lat,lon],
            {
                radius:accuracy,
                color:"#35e58b",
                weight:1,
                fillColor:"#35e58b",
                fillOpacity:.08
            }
        ).addTo(map);

    }else{

        accuracyCircle.setLatLng([lat,lon]);
        accuracyCircle.setRadius(accuracy);

    }

    if(followMode && !planningMode){

        map.panTo([lat,lon], {
            animate:true,
            duration:.4
        });

    }

    if(!tracking || paused){

        return;
    }

    if(accuracy > MAX_ACCEPTABLE_ACCURACY){

        message.textContent =
            "Señal débil (±" + Math.round(accuracy) +
            " m) • esperando mejor precisión...";

        return;

    }

    const point = {
        lat,
        lon,
        accuracy,
        timestamp:Date.now()
    };

    if(lastPosition){

        const distance =
            calculateDistance(
                lastPosition.lat,
                lastPosition.lon,
                lat,
                lon
            );

        const noiseThreshold =
            Math.max(3, Math.min(accuracy, lastPosition.accuracy) * 0.6);

        if(
            distance > noiseThreshold &&
            distance < 100
        ){

            totalDistance += distance;
            lastPosition = point;

        }

    }else{

        lastPosition = point;

    }

    route.push(point);

    routeLine.setLatLngs(
        route.map(p => [p.lat,p.lon])
    );

    distanceEl.textContent =
        (totalDistance / 1000).toFixed(2);

    message.textContent =
        "Ruta registrada • precisión ±" +
        Math.round(accuracy) +
        " m";
}


/* =========================================
   ERROR GPS
   ========================================= */

function handleGPSError(error){

    statusDot.classList.remove("active","warn");
    statusDot.classList.add("error");
    statusText.textContent = "GPS sin señal";

    if(error.code === error.PERMISSION_DENIED){

        message.textContent =
            "Permite el acceso a tu ubicación en los ajustes del navegador para usar Fer Walk.";

    }else if(error.code === error.POSITION_UNAVAILABLE){

        message.textContent =
            "No se pudo determinar tu ubicación. Revisa que el GPS esté activado.";

    }else if(error.code === error.TIMEOUT){

        message.textContent =
            "Se agotó el tiempo esperando al GPS. Reintentando...";

    }else{

        message.textContent =
            "No se pudo obtener la ubicación.";

    }

}


/* =========================================
   INICIAR
   ========================================= */

startBtn.addEventListener("click", async ()=>{

    if(!mapReady){

        return;

    }

    if(!navigator.geolocation){

        alert("Tu navegador no admite geolocalización.");

        return;
    }

    if(!window.isSecureContext){

        alert("Fer Walk necesita una conexión segura (HTTPS) para usar el GPS.");

        return;
    }

    if(planningMode){

        setPlanningMode(false);

    }

    tracking = true;
    paused = false;

    route = [];
    totalDistance = 0;

    startTime = Date.now();
    pausedTime = 0;

    lastPosition = null;

    routeLine.setLatLngs([]);

    distanceEl.textContent = "0.00";
    timeEl.textContent = "00:00";
    speedEl.textContent = "0.0";
    paceEl.textContent = "--:--";

    startBtn.style.display = "none";
    pauseBtn.style.display = "block";
    stopBtn.style.display = "block";

    setFollowMode(true);

    message.textContent =
        "Buscando señal GPS...";

    startGPS();

    await requestWakeLock();

    timerInterval = setInterval(
        updateTimer,
        1000
    );

});


/* =========================================
   PAUSAR
   ========================================= */

pauseBtn.addEventListener("click",()=>{

    if(!tracking) return;

    if(!paused){

        paused = true;
        pauseStarted = Date.now();

        pauseBtn.textContent = "▶";

        message.textContent =
            "Caminata pausada.";

        releaseWakeLock();

    }else{

        paused = false;

        pausedTime +=
            Date.now() - pauseStarted;

        lastPosition = null;

        pauseBtn.textContent = "⏸";

        message.textContent =
            "Caminata reanudada.";

        requestWakeLock();

    }

});


/* =========================================
   TERMINAR
   ========================================= */

stopBtn.addEventListener("click",()=>{

    if(!tracking) return;

    if(
        totalDistance > 20 &&
        !confirm("¿Terminar la caminata actual? Se guardará el resumen.")
    ){

        return;

    }

    tracking = false;

    if(paused){

        pausedTime +=
            Date.now() - pauseStarted;

        paused = false;
    }

    if(watchId !== null){

        navigator.geolocation.clearWatch(
            watchId
        );

        watchId = null;
    }

    clearInterval(timerInterval);
    releaseWakeLock();

    const elapsed =
        (Date.now() - startTime - pausedTime) / 1000;

    const averageSpeed =
        elapsed > 0
        ? (totalDistance/1000)/(elapsed/3600)
        : 0;

    document.getElementById("finalDistance")
        .textContent =
        (totalDistance/1000).toFixed(2) + " km";

    document.getElementById("finalTime")
        .textContent =
        formatTime(elapsed);

    document.getElementById("finalSpeed")
        .textContent =
        averageSpeed.toFixed(1) + " km/h";

    document.getElementById("finalPoints")
        .textContent =
        route.length;

    summary.style.display = "flex";

    startBtn.style.display = "block";
    pauseBtn.style.display = "none";
    stopBtn.style.display = "none";

    pauseBtn.textContent = "⏸";

    message.textContent =
        "Caminata terminada.";

});


/* =========================================
   CERRAR RESUMEN
   ========================================= */

closeSummary.addEventListener("click",()=>{

    summary.style.display = "none";

});


/* =========================================
   UBICACIÓN ACTUAL
   ========================================= */

locateBtn.addEventListener("click",()=>{

    setFollowMode(true);

    if(userMarker){

        map.setView(
            userMarker.getLatLng(),
            17,
            {
                animate:true
            }
        );

        return;
    }

    if(!navigator.geolocation){

        alert("GPS no disponible.");

        return;
    }

    navigator.geolocation.getCurrentPosition(

        position => {

            map.setView(
                [position.coords.latitude, position.coords.longitude],
                17
            );

        },

        () => {

            alert(
                "No se pudo obtener tu ubicación."
            );

        },

        {
            enableHighAccuracy:true,
            timeout:10000
        }

    );

});


/* =========================================
   CARGA DE LEAFLET CON RESPALDO
   ========================================= */

function loadScriptOnce(src){

    return new Promise((resolve, reject) => {

        const already = document.querySelector(
            'script[data-src="' + src + '"]'
        );

        if(already){

            resolve();
            return;

        }

        const s = document.createElement("script");

        s.src = src;
        s.setAttribute("data-src", src);
        s.onload = () => resolve();
        s.onerror = () => reject(new Error("No se pudo cargar " + src));

        document.head.appendChild(s);

    });

}

async function ensureLeaflet(){

    if(typeof L !== "undefined") return;

    const sources = [
        "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js",
        "https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    ];

    for(const src of sources){

        try{

            await loadScriptOnce(src);

            if(typeof L !== "undefined") return;

        }catch(e){

            /* probamos la siguiente fuente */

        }

    }

    throw new Error("No se pudo cargar la librería del mapa.");

}


/* =========================================
   INICIALIZACIÓN
   ========================================= */

async function initApp(){

    try{

        await ensureLeaflet();

    }catch(e){

        document.getElementById("map").innerHTML =
            '<div class="map-error">' +
            'No se pudo cargar el mapa. Revisa tu conexión a internet ' +
            'y recarga la página para volver a intentarlo.' +
            '</div>';

        statusDot.classList.add("error");
        statusText.textContent = "Sin conexión al mapa";
        message.textContent =
            "No se pudo cargar el mapa. Recarga la página.";

        return;

    }

    map = L.map("map", {
        zoomControl:false
    }).setView([19.4326,-99.1332], 15);

    L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
            maxZoom:19,
            attribution:"© OpenStreetMap"
        }
    ).addTo(map);

    L.control.zoom({
        position:"topright"
    }).addTo(map);

    routeLine = L.polyline([], {
        color:"#35e58b",
        weight:6,
        opacity:.9
    }).addTo(map);

    map.on("dragstart", () => {

        if(followMode){

            setFollowMode(false);

        }

    });

    window.addEventListener("resize", () => {

        map.invalidateSize();

    });

    mapReady = true;

    startBtn.disabled = false;
    locateBtn.disabled = false;
    followBtn.disabled = false;
    planBtn.disabled = false;

    statusDot.classList.remove("error");
    statusText.textContent = "GPS inactivo";
    message.textContent =
        'Pulsa "Iniciar caminata" para comenzar.';

    if(navigator.geolocation && window.isSecureContext){

        startGPS();

    }

}

initApp();

</script>
